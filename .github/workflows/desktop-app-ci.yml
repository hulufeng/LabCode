# LabCode 桌面端（JS 版 / desktop-app）主线 CI
#
# 说明：
# - 本仓库主线是 JS 版，入口为 desktop-app/main/index.js，纯 JS 无编译步骤
#   （运行 = electron .，打包 = electron-builder），因此 CI 不做 tsc / electron-vite。
# - verify 任务的两个校验脚本只读取源码、不依赖 node_modules，
#   故无需 npm install，可秒级完成。
# - package 任务会真正产出 Windows 安装包（NSIS x64）。

name: desktop-app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 契约与主题校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: IPC 契约校验（channel 缺口 / preload API 缺口 / handler 重复注册）
        working-directory: desktop-app
        run: node scripts/verify-ipc-contract.cjs

      - name: 主题 token 校验（对齐 TrieCode v1.3.1）
        working-directory: desktop-app
        run: node scripts/theme-probe.mjs

  package:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    needs: verify

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      # package.json 里 "npmRebuild": false，electron-builder 不会自动重编原生模块
      # （日志会显示 skipped dependencies rebuild）。
      # node-pty 默认按 Node 运行时编译，与 electron 28（ABI 116）不匹配，
      # 不重编的话打包产物启动即崩（NODE_MODULE_VERSION 不一致）。
      #
      # 这里不用 @electron/rebuild：它会走 node-gyp 默认参数，而 gyp 生成的 vcxproj
      # 带 <SpectreMitigation>Spectre</SpectreMitigation>，在没装 Spectre 缓解库的
      # 机器上会报 MSB8040 导致构建失败。故手动调用 MSBuild 并传入
      # /p:SpectreMitigation=false 覆盖（已在本机验证通过）。
      - name: 为 electron 重编 node-pty
        working-directory: desktop-app
        shell: pwsh
        run: |
          $env:npm_config_runtime = 'electron'
          $env:npm_config_target = '28.3.3'
          $env:npm_config_arch = 'x64'
          Push-Location node_modules/node-pty
          npx --yes node-gyp configure
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msb = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msb) { throw 'MSBuild not found' }
          & $msb build/binding.sln /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false
          if ($LASTEXITCODE -ne 0) { throw "node-pty rebuild failed (exit $LASTEXITCODE)" }
          Pop-Location

      - name: 打包（NSIS x64）
        working-directory: desktop-app
        run: npx electron-builder --win --x64

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: LabCode-win-x64
          path: desktop-app/dist/*.exe
          if-no-files-found: error
