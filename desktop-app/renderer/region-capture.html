<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>区域截图</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;cursor:crosshair;-webkit-user-select:none;user-select:none;background:transparent;}
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.32);}
  #sel{position:fixed;border:2px solid #4f8cff;background:rgba(79,140,255,.12);display:none;box-shadow:0 0 0 1px rgba(0,0,0,.4);}
  #info{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,24,40,.85);color:#e8ecf5;font:600 14px/1.4 "Segoe UI",system-ui,sans-serif;padding:8px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;}
  #size{position:fixed;right:-9999px;bottom:8px;background:rgba(20,24,40,.85);color:#fff;font:600 12px/1.4 "Segoe UI";padding:4px 10px;border-radius:8px;pointer-events:none;}
</style>
</head>
<body>
  <div id="mask"></div>
  <div id="sel"></div>
  <div id="info">拖拽框选截图区域 · Esc 取消</div>
  <div id="size"></div>
<script>
  // 窗口为 contextIsolation + nodeIntegration:false，IPC 只能走 preload 暴露的 window.region
  const regionBridge = window.region || { selected: () => Promise.resolve({ success: false, error: 'bridge unavailable' }), cancel: () => Promise.resolve() };
  const mask = document.getElementById('mask');
  const sel = document.getElementById('sel');
  const size = document.getElementById('size');
  let start = null;

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    start = { x: e.clientX, y: e.clientY };
    sel.style.display = 'block';
    sel.style.left = start.x + 'px';
    sel.style.top = start.y + 'px';
    sel.style.width = '0px';
    sel.style.height = '0px';
  });
  document.addEventListener('mousemove', (e) => {
    if (!start) return;
    const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
    const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
    sel.style.left = x + 'px'; sel.style.top = y + 'px';
    sel.style.width = w + 'px'; sel.style.height = h + 'px';
    size.style.right = '8px';
    size.textContent = w + ' × ' + h;
  });
  document.addEventListener('mouseup', async (e) => {
    if (!start || e.button !== 0) return;
    const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
    const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
    start = null;
    sel.style.display = 'none';
    if (w < 4 || h < 4) return; // 过小忽略，等待重新框选
    const rect = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
    try { await regionBridge.selected(rect); } catch (e) {}
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { try { regionBridge.cancel(); } catch (e2) {} }
  });
</script>
</body>
</html>
