<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabCode 官网后台</title>
<style>
  :root{
    --bg:#f6f8fc; --panel:#ffffff; --border:#e3e8f0; --text:#0f172a; --text2:#475569;
    --text3:#94a3b8; --accent:#4a7dff; --accent2:#3a6def; --accent-soft:#eef2ff;
    --green:#10b981; --red:#ef4444; --orange:#f59e0b; --shadow:0 6px 24px rgba(15,23,42,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:80px}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600}
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:var(--accent-soft);color:var(--accent2)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* 登录 */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px;width:340px}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card p{color:var(--text3);font-size:13px;margin-bottom:22px}
  .login-card label{display:block;font-size:12px;color:var(--text2);margin:12px 0 5px}
  .login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  /* 布局 */
  #app{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--border)}
  .topbar .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}
  .topbar .brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text2)}
  .wrap{display:flex;min-height:calc(100vh - 59px)}
  .sidebar{width:190px;background:var(--panel);border-right:1px solid var(--border);padding:14px 10px}
  .navitem{padding:10px 14px;border-radius:9px;color:var(--text2);font-size:14px;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .navitem:hover{background:var(--bg)}
  .navitem.active{background:var(--accent-soft);color:var(--accent2);font-weight:600}
  .content{flex:1;padding:26px 30px;overflow:auto}
  .page{display:none}
  .page.active{display:block}
  .page h2{font-size:19px;margin-bottom:4px}
  .page .sub{color:var(--text3);font-size:13px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--text3);font-size:12px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{color:var(--text3);font-weight:600;font-size:12px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.on{background:#e7f8f1;color:var(--green)}
  .badge.off{background:#f1f5f9;color:var(--text3)}
  .badge.unread{background:#fef3e2;color:var(--orange)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row .field{flex:1;min-width:160px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
  .actions{display:flex;gap:8px}
  .muted{color:var(--text3);font-size:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .empty{color:var(--text3);font-size:13px;padding:20px 4px}
</style>
<script>var SITE_BASE=(function(){var f=location.pathname.split('/').filter(Boolean)[0];return f==='codelab'?'/codelab':'';})();</script>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>LabCode 官网后台</h1>
    <p>管理员登录</p>
    <label>邮箱</label>
    <input id="le" type="email" placeholder="admin@labcode.dev" value="admin@labcode.dev">
    <label>密码</label>
    <input id="lp" type="password" placeholder="admin123">
    <div class="login-err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">C</span> LabCode 官网后台</div>
    <div class="right">
      <span id="who"></span>
      <button class="btn ghost sm" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="wrap">
    <div class="sidebar">
      <div class="navitem active" data-page="overview" onclick="go('overview')">📊 概览</div>
      <div class="navitem" data-page="plugins" onclick="go('plugins')">🧩 插件上架</div>
      <div class="navitem" data-page="contacts" onclick="go('contacts')">✉️ 联系留言</div>
      <div class="navitem" data-page="content" onclick="go('content')">📝 内容管理</div>
      <div class="navitem" data-page="downloads" onclick="go('downloads')">📥 下载统计</div>
      <div class="navitem" data-page="version" onclick="go('version')">🏷️ 版本设置</div>
    </div>
    <div class="content">
      <!-- 概览 -->
      <div class="page active" id="page-overview">
        <h2>概览</h2><div class="sub">站点与后台关键指标</div>
        <div class="grid" id="ovGrid"></div>
      </div>
      <!-- 插件 -->
      <div class="page" id="page-plugins">
        <h2>插件上架</h2><div class="sub">管理官网插件市场（/api/plugins 公开读取）</div>
        <div class="card">
          <b style="font-size:14px">新增 / 编辑插件</b>
          <div class="row" style="margin-top:12px">
            <div class="field"><label>ID（唯一，英文）</label><input id="p_id" placeholder="arduino-cli-toolchain"></div>
            <div class="field"><label>名称</label><input id="p_name" placeholder="Arduino CLI 工具链"></div>
            <div class="field"><label>版本</label><input id="p_version" placeholder="0.4.0"></div>
          </div>
          <div class="row">
            <div class="field"><label>图标 Emoji</label><input id="p_icon" placeholder="🔌"></div>
            <div class="field"><label>分类</label>
              <select id="p_category"><option value="embedded">嵌入式工具链</option><option value="ai">AI 与开发辅助</option><option value="hardware">硬件</option></select>
            </div>
            <div class="field"><label>GitHub 链接</label><input id="p_github" placeholder="https://github.com/..."></div>
          </div>
          <div class="field"><label>描述</label><textarea id="p_desc" placeholder="一句话说明"></textarea></div>
          <div class="field"><label>标签（逗号分隔）</label><input id="p_tags" placeholder="编译, 烧录"></div>
          <div class="row" style="align-items:center">
            <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)"><input type="checkbox" id="p_pub" style="width:auto" checked> 公开上架（勾选后才在官网展示）</label>
            <div style="flex:1"></div>
            <button class="btn ghost sm" onclick="resetPluginForm()">清空</button>
            <button class="btn sm" onclick="savePlugin()">保存插件</button>
          </div>
        </div>
        <div class="card"><div id="pluginList"></div></div>
      </div>
      <!-- 联系 -->
      <div class="page" id="page-contacts">
        <h2>联系留言</h2><div class="sub">访客通过官网联系表单提交的留言</div>
        <div class="card"><div id="contactList"></div></div>
      </div>
      <!-- 内容 -->
      <div class="page" id="page-content">
        <h2>内容管理</h2><div class="sub">可编辑的内容块，官网通过 /api/content/:key 读取</div>
        <div class="card">
          <b style="font-size:14px">新增 / 编辑内容块</b>
          <div class="row" style="margin-top:12px">
            <div class="field"><label>Key（唯一，英文）</label><input id="c_key" placeholder="announcement"></div>
            <div class="field"><label>标题</label><input id="c_title" placeholder="站点公告"></div>
          </div>
          <div class="field"><label>正文（支持纯文本）</label><textarea id="c_body" placeholder="内容..."></textarea></div>
          <div class="row">
            <button class="btn ghost sm" onclick="resetContentForm()">清空</button>
            <button class="btn sm" onclick="saveContent()">保存内容</button>
          </div>
        </div>
        <div class="card"><div id="contentList"></div></div>
      </div>
      <!-- 下载 -->
      <div class="page" id="page-downloads">
        <h2>下载统计</h2><div class="sub">访客点击下载按钮（/d/:platform）自动计数</div>
        <div class="card"><div id="dlStats"></div></div>
      </div>
      <!-- 版本 -->
      <div class="page" id="page-version">
        <h2>版本设置</h2><div class="sub">设置官网展示的最新版本号与更新说明（/api/version）</div>
        <div class="card">
          <div class="row">
            <div class="field"><label>最新版本号</label><input id="v_latest" placeholder="0.1.9"></div>
          </div>
          <div class="field"><label>更新说明</label><textarea id="v_notes"></textarea></div>
          <button class="btn sm" onclick="saveVersion()">保存版本</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = SITE_BASE;
let TOKEN = localStorage.getItem('site_admin_token') || '';
let ME = null;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
async function api(path, opts={}){
  const headers={'Content-Type':'application/json'};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const res=await fetch(API+path,{...opts,headers});
  if(res.status===401 && path!=='/api/admin/login'){TOKEN='';localStorage.removeItem('site_admin_token');showLogin();throw new Error('未授权');}
  let data=null;try{data=await res.json();}catch{}
  return {res,data};
}
function showLogin(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';}

async function doLogin(){
  const email=document.getElementById('le').value.trim();
  const password=document.getElementById('lp').value;
  const {res,data}=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email,password})});
  if(res.ok){TOKEN=data.token;localStorage.setItem('site_admin_token',TOKEN);ME=data.user;enter();}
  else{document.getElementById('lerr').textContent=data?.error||'登录失败';}
}
function doLogout(){localStorage.removeItem('site_admin_token');TOKEN='';showLogin();}
function enter(){showApp();document.getElementById('who').textContent=ME?ME.email:'';go('overview');loadOverview();}

function go(page){
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));
  if(page==='overview')loadOverview();
  if(page==='plugins')loadPlugins();
  if(page==='contacts')loadContacts();
  if(page==='content')loadContent();
  if(page==='downloads')loadDownloads();
  if(page==='version')loadVersion();
}

async function loadOverview(){
  const {res,data}=await api('/api/admin/overview');
  if(!res.ok)return;
  const cards=[
    {n:data.plugins,l:'插件总数'},
    {n:data.publishedPlugins,l:'已上架插件'},
    {n:data.contacts,l:'联系留言'},
    {n:data.unreadContacts,l:'未读留言'},
    {n:data.contentBlocks,l:'内容块'},
    {n:data.downloads,l:'下载次数'},
  ];
  document.getElementById('ovGrid').innerHTML=cards.map(c=>`<div class="stat"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join('');
}

// 插件
let editingPlugin=null;
async function loadPlugins(){
  const {res,data}=await api('/api/admin/plugins');
  if(!res.ok)return;
  const rows=(data.plugins||[]).map(p=>`
    <tr>
      <td>${p.icon||''} ${p.name}</td>
      <td>v${p.version}</td>
      <td>${p.category}</td>
      <td>${p.installs||0}</td>
      <td><span class="badge ${p.published?'on':'off'}">${p.published?'已上架':'未上架'}</span></td>
      <td><div class="actions">
        <button class="btn ghost sm" onclick="editPlugin('${p.id}')">编辑</button>
        <button class="btn danger sm" onclick="delPlugin('${p.id}')">删除</button>
      </div></td>
    </tr>`).join('');
  document.getElementById('pluginList').innerHTML=`<table><thead><tr><th>名称</th><th>版本</th><th>分类</th><th>安装数</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class="empty">暂无插件</td></tr>'}</tbody></table>`;
}
function resetPluginForm(){editingPlugin=null;['p_id','p_name','p_version','p_icon','p_github','p_desc','p_tags'].forEach(i=>document.getElementById(i).value='');document.getElementById('p_category').value='embedded';document.getElementById('p_pub').checked=true;}
function editPlugin(id){api('/api/admin/plugins').then(async({data})=>{const p=(data.plugins||[]).find(x=>x.id===id);if(!p)return;editingPlugin=id;document.getElementById('p_id').value=p.id;document.getElementById('p_id').disabled=true;document.getElementById('p_name').value=p.name;document.getElementById('p_version').value=p.version;document.getElementById('p_icon').value=p.icon;document.getElementById('p_category').value=p.category;document.getElementById('p_github').value=p.github;document.getElementById('p_desc').value=p.description;document.getElementById('p_tags').value=(p.tags||[]).join(', ');document.getElementById('p_pub').checked=p.published;window.scrollTo({top:0,behavior:'smooth'});});}
async function savePlugin(){
  const id=document.getElementById('p_id').value.trim();
  const payload={name:document.getElementById('p_name').value.trim(),version:document.getElementById('p_version').value.trim(),icon:document.getElementById('p_icon').value.trim(),category:document.getElementById('p_category').value,github:document.getElementById('p_github').value.trim(),description:document.getElementById('p_desc').value.trim(),tags:document.getElementById('p_tags').value.split(',').map(s=>s.trim()).filter(Boolean),published:document.getElementById('p_pub').checked};
  if(editingPlugin){const {res,data}=await api('/api/admin/plugins/'+editingPlugin,{method:'PUT',body:JSON.stringify(payload)});if(res.ok){toast('已更新');resetPluginForm();document.getElementById('p_id').disabled=false;loadPlugins();}else toast(data?.error||'更新失败');}
  else{if(!id){toast('ID 必填');return;}const {res,data}=await api('/api/admin/plugins',{method:'POST',body:JSON.stringify({id,...payload})});if(res.ok){toast('已上架');resetPluginForm();loadPlugins();}else toast(data?.error||'保存失败');}
}
async function delPlugin(id){if(!confirm('确认删除该插件？'))return;const {res}=await api('/api/admin/plugins/'+id,{method:'DELETE'});if(res.ok){toast('已删除');loadPlugins();}else toast('删除失败');}

// 联系
async function loadContacts(){
  const {res,data}=await api('/api/admin/contacts');
  if(!res.ok)return;
  const rows=(data.contacts||[]).map(c=>`
    <tr>
      <td>${c.name||'(匿名)'}<br><span class="muted">${c.email||''}</span></td>
      <td>${escapeHtml(c.message)}</td>
      <td>${new Date(c.ts).toLocaleString('zh-CN')}</td>
      <td><span class="badge ${c.read?'off':'unread'}">${c.read?'已读':'未读'}</span></td>
      <td><div class="actions">
        ${c.read?'':`<button class="btn ghost sm" onclick="markRead('${c.id}')">标已读</button>`}
        <button class="btn danger sm" onclick="delContact('${c.id}')">删除</button>
      </div></td>
    </tr>`).join('');
  document.getElementById('contactList').innerHTML=`<table><thead><tr><th>访客</th><th>留言</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class="empty">暂无留言</td></tr>'}</tbody></table>`;
}
async function markRead(id){const {res}=await api('/api/admin/contacts/'+id,{method:'POST'});if(res.ok)loadContacts();}
async function delContact(id){if(!confirm('确认删除？'))return;const {res}=await api('/api/admin/contacts/'+id,{method:'DELETE'});if(res.ok)loadContacts();}

// 内容
let editingContent=null;
async function loadContent(){
  const {res,data}=await api('/api/admin/content');
  if(!res.ok)return;
  const rows=(data.content||[]).map(c=>`
    <tr>
      <td>${c.key}</td><td>${c.title}</td><td>${new Date(c.updatedAt).toLocaleString('zh-CN')}</td>
      <td><div class="actions">
        <button class="btn ghost sm" onclick="editContent('${c.key}')">编辑</button>
        <button class="btn danger sm" onclick="delContent('${c.key}')">删除</button>
      </div></td>
    </tr>`).join('');
  document.getElementById('contentList').innerHTML=`<table><thead><tr><th>Key</th><th>标题</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=4 class="empty">暂无内容块</td></tr>'}</tbody></table>`;
}
function resetContentForm(){editingContent=null;document.getElementById('c_key').value='';document.getElementById('c_key').disabled=false;document.getElementById('c_title').value='';document.getElementById('c_body').value='';}
function editContent(key){api('/api/admin/content').then(async({data})=>{const c=(data.content||[]).find(x=>x.key===key);if(!c)return;editingContent=key;document.getElementById('c_key').value=c.key;document.getElementById('c_key').disabled=true;document.getElementById('c_title').value=c.title;document.getElementById('c_body').value=c.body;window.scrollTo({top:0,behavior:'smooth'});});}
async function saveContent(){
  const key=document.getElementById('c_key').value.trim();
  const payload={title:document.getElementById('c_title').value.trim(),body:document.getElementById('c_body').value};
  if(editingContent){const {res,data}=await api('/api/admin/content/'+editingContent,{method:'PUT',body:JSON.stringify(payload)});if(res.ok){toast('已更新');resetContentForm();loadContent();}else toast(data?.error||'更新失败');}
  else{if(!key){toast('Key 必填');return;}const {res,data}=await api('/api/admin/content',{method:'POST',body:JSON.stringify({key,...payload})});if(res.ok){toast('已保存');resetContentForm();loadContent();}else toast(data?.error||'保存失败');}
}
async function delContent(key){if(!confirm('确认删除？'))return;const {res}=await api('/api/admin/content/'+key,{method:'DELETE'});if(res.ok){toast('已删除');loadContent();}else toast('删除失败');}

// 下载
async function loadDownloads(){
  const {res,data}=await api('/api/admin/downloads');
  if(!res.ok)return;
  const plat=Object.entries(data.byPlatform||{}).map(([k,v])=>`<span class="badge on">${k}: ${v}</span>`).join(' ');
  const ver=Object.entries(data.byVersion||{}).map(([k,v])=>`<span class="badge off">v${k}: ${v}</span>`).join(' ');
  const recent=(data.recent||[]).slice(0,20).map(d=>`<tr><td>${d.platform}</td><td>v${d.version}</td><td>${d.ip}</td><td>${new Date(d.ts).toLocaleString('zh-CN')}</td></tr>`).join('');
  document.getElementById('dlStats').innerHTML=`
    <div class="grid" style="margin-bottom:16px">
      <div class="stat"><div class="n">${data.total}</div><div class="l">总下载次数</div></div>
    </div>
    <p class="muted" style="margin:10px 0 6px">按平台</p><div>${plat||'<span class="muted">暂无</span>'}</div>
    <p class="muted" style="margin:14px 0 6px">按版本</p><div>${ver||'<span class="muted">暂无</span>'}</div>
    <p class="muted" style="margin:14px 0 6px">最近记录</p>
    <table><thead><tr><th>平台</th><th>版本</th><th>IP</th><th>时间</th></tr></thead><tbody>${recent||'<tr><td colspan=4 class="empty">暂无</td></tr>'}</tbody></table>`;
}

// 版本
async function loadVersion(){const {res,data}=await api('/api/version');if(res.ok){document.getElementById('v_latest').value=data.latest;document.getElementById('v_notes').value=data.notes;}}
async function saveVersion(){
  const payload={latest:document.getElementById('v_latest').value.trim(),notes:document.getElementById('v_notes').value};
  const {res,data}=await api('/api/admin/version',{method:'PUT',body:JSON.stringify(payload)});
  if(res.ok)toast('版本已保存');else toast(data?.error||'保存失败');
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// 启动：若有 token 先校验
(async()=>{
  if(TOKEN){
    const {res,data}=await api('/api/admin/overview');
    if(res.ok){ME=data;enter();return;}
  }
  showLogin();
})();
</script>
